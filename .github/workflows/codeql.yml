name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '24 3 * * 0'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (cpp)
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual

      - name: Install MinGW-w64
        shell: pwsh
        run: choco install mingw --yes --no-progress

      - name: Download WebView2 SDK
        shell: pwsh
        run: |
          $package = Join-Path $env:RUNNER_TEMP 'webview2.zip'
          $sdk = Join-Path $env:RUNNER_TEMP 'webview2'
          Invoke-WebRequest 'https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2' -OutFile $package
          Expand-Archive -LiteralPath $package -DestinationPath $sdk -Force
          "WEBVIEW2_INCLUDE=$sdk\build\native\include" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "WEBVIEW2_LOADER=$sdk\runtimes\win-x64\native\WebView2Loader.dll" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build
        shell: pwsh
        run: python scripts/build.py

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
