<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
  <title>QuickFileCopy</title>
  <style>
    :root {
      --bg:#090c11; --panel:rgba(18,23,33,.92); --panel2:#111722;
      --line:rgba(255,255,255,.09); --text:#f2f5f9; --muted:#98a3b3;
      --cyan:#00e5f5; --blue:#3b82f6; --purple:#8b5cf6; --green:#10b981;
      --red:#ef4444; --amber:#f59e0b; --shadow:0 14px 34px rgba(0,0,0,.34);
    }
    *{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text)}
    body{font-family:"Segoe UI",Yu Gothic UI,sans-serif;background-image:radial-gradient(circle at 0 0,rgba(59,130,246,.13),transparent 38%),radial-gradient(circle at 100% 0,rgba(139,92,246,.11),transparent 40%);padding:10px 14px}
    button,select{font:inherit} button{cursor:pointer}.app{max-width:950px;margin:auto;display:grid;gap:10px}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
    header{display:flex;align-items:stretch;justify-content:space-between;padding:13px 15px;gap:14px}
    .brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 20px rgba(0,229,245,.28);font-size:20px;color:#041014}
    h1{font-size:18px;margin:0;letter-spacing:-.35px}.accent{color:var(--cyan)}.subtitle{font-size:11px;color:var(--muted);margin-top:2px}.version{font-size:10px;color:var(--cyan);border:1px solid rgba(0,229,245,.35);background:rgba(0,229,245,.1);padding:2px 6px;border-radius:5px;margin-left:7px}.history{max-width:220px;color:var(--muted);font-size:10px;background:#0b1018;border:1px solid var(--line);border-radius:5px;padding:2px 5px}
    .toolbar{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.field{display:flex;align-items:center;gap:6px;padding:6px 8px;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:7px}.field label{font-size:11px;color:var(--muted)}.header-actions{display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:.25rem;flex-shrink:0}.btn-action{background:rgba(255,255,255,.05);color:var(--text);border:1px solid var(--line);font-size:.68rem;font-weight:600;padding:.22rem .6rem;border-radius:6px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:.25rem;transition:all .2s;white-space:nowrap;width:100%}.btn-action:hover{background:rgba(0,229,245,.12);border-color:var(--cyan);color:#fff}
    select{color:var(--text);background:#0b1018;border:0;outline:0;font-size:12px}.content{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px}.main{padding:12px;display:grid;gap:8px}
    .path-card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px}.path-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.path-title{font-size:12px;font-weight:700}.path-title.source{color:var(--cyan)}.path-title.destination{color:#a78bfa}
    .path-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.path{min-height:39px;display:flex;align-items:center;padding:8px 10px;background:#090e15;border:1px solid var(--line);border-radius:7px;color:var(--muted);font:12px Consolas,"Cascadia Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.path.selected{color:var(--text);border-color:rgba(0,229,245,.25)}
    .browse{border:1px solid rgba(0,229,245,.3);background:rgba(0,229,245,.09);color:var(--cyan);border-radius:7px;padding:0 14px;font-size:12px;font-weight:700}.browse:hover{background:rgba(0,229,245,.16)}
    .direction{text-align:center;color:var(--cyan);font-size:20px;line-height:18px;text-shadow:0 0 10px rgba(0,229,245,.5)}
    .actions{display:flex;justify-content:flex-end;gap:8px;padding-top:3px}.primary,.cancel{border:0;border-radius:8px;padding:9px 18px;font-size:12px;font-weight:750}.primary{color:#031014;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 15px rgba(0,229,245,.25)}.primary:disabled{opacity:.42;cursor:not-allowed}.cancel{color:#fff;background:linear-gradient(135deg,#f05252,#c92828);display:none}
    .side{padding:12px;display:grid;align-content:start;gap:10px}.side-title,.progress-title{font-size:12px;font-weight:700;display:flex;gap:7px;align-items:center}.side-title{color:var(--cyan)}.metric{display:grid;grid-template-columns:1fr auto;align-items:end;padding:9px 0;border-bottom:1px solid var(--line)}.metric:last-child{border:0}.metric-label{font-size:11px;color:var(--muted)}.metric-value{font:700 17px Consolas,"Cascadia Mono",monospace}.metric-unit{font-size:9px;color:var(--muted);margin-left:3px}
    .progress-card{padding:12px 14px}.progress-head,.file-progress-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.status{font-size:12px;color:var(--cyan);font-weight:650}.percent{font:700 20px Consolas,"Cascadia Mono",monospace}.track{height:7px;background:rgba(255,255,255,.06);border-radius:10px;overflow:hidden;margin:9px 0}.fill{width:0;height:100%;background:linear-gradient(90deg,var(--cyan),var(--blue),var(--purple));box-shadow:0 0 10px var(--cyan);transition:width .18s ease}.track.indeterminate .fill{width:35%!important;animation:scan-progress 1.05s ease-in-out infinite}.file-progress-head{margin-top:8px;color:var(--muted);font-size:10px}.file-track{height:4px;margin:5px 0 9px}.file-fill{background:linear-gradient(90deg,var(--green),var(--cyan));box-shadow:0 0 8px rgba(16,185,129,.45)}@keyframes scan-progress{from{transform:translateX(-120%)}to{transform:translateX(300%)}}
    .progress-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.stat{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px}.stat b{display:block;font:700 15px Consolas,"Cascadia Mono",monospace}.stat span{font-size:10px;color:var(--muted)}.current{margin-top:8px;color:var(--muted);font:10px Consolas,"Cascadia Mono",monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice{display:none;margin-top:8px;border-radius:7px;padding:8px 10px;font-size:11px}.notice.error{display:block;color:#fecaca;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3)}.notice.done{display:block;color:#a7f3d0;background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.28)}.error-list{display:none;max-height:140px;overflow:auto;margin-top:7px;padding:7px 9px;border-radius:7px;background:#090e15;border:1px solid rgba(239,68,68,.25);font:10px Consolas,"Cascadia Mono",monospace;color:#fecaca;white-space:pre-wrap}.error-list.visible{display:block}
    .foot{font-size:10px;color:#606b7a;text-align:center;padding:0 2px}@media(max-width:760px){.content{grid-template-columns:1fr}.side{grid-template-columns:repeat(2,1fr)}.side-title{grid-column:1/-1}.progress-grid{grid-template-columns:repeat(2,1fr)}header{flex-direction:column}.toolbar{justify-content:flex-start}}
  </style>
</head>
<body>
<main class="app">
  <header class="card">
    <div class="brand">
      <div class="logo">⇲</div>
      <div><h1>Quick<span class="accent">FileCopy</span><span class="version">Native 0.1.0</span></h1><div class="subtitle">Win32 native copy engine · WebView2</div></div>
    </div>
    <div class="toolbar">
      <div class="field"><label for="mode" data-i18n="modeLabel">モード</label><select id="mode"><option value="fast" data-i18n="modeFast">高速</option><option value="verify" data-i18n="modeVerify">検証（SHA-256）</option><option value="complete" data-i18n="modeComplete">完全保持（管理者）</option><option value="completeVerify" data-i18n="modeCompleteVerify">完全保持＋検証（管理者）</option></select></div>
      <div class="field"><label for="layout" data-i18n="layoutLabel">配置</label><select id="layout"><option value="contents" data-i18n="layoutContents">中身をコピー</option><option value="folder" data-i18n="layoutFolder">フォルダごと</option></select></div>
      <div class="field"><label for="policy" data-i18n="policyLabel">競合</label><select id="policy"><option value="skip" data-i18n="policySkip">スキップ</option><option value="overwrite" data-i18n="policyOverwrite">上書き</option><option value="newer" data-i18n="policyNewer">新しい方</option></select></div>
    </div>
    <div class="header-actions"><button id="btn-lang" class="btn-action" type="button" title="Toggle Language / 言語切替"><span id="lang-text">🌐 English</span></button></div>
  </header>

  <section class="content">
    <div class="card main">
      <div class="path-card">
        <div class="path-head"><span class="path-title source" data-i18n="sourceTitle">● コピー元</span><select id="source-history" class="history"><option value="">履歴</option></select></div>
        <div class="path-row"><div id="source-path" class="path">コピー元を選択してください</div><button id="pick-source" class="browse" data-i18n="browse">参照</button></div>
      </div>
      <div class="direction">▼</div>
      <div class="path-card">
        <div class="path-head"><span class="path-title destination" data-i18n="destinationTitle">● コピー先</span><select id="destination-history" class="history"><option value="">履歴</option></select></div>
        <div class="path-row"><div id="destination-path" class="path">コピー先を選択してください</div><button id="pick-destination" class="browse" data-i18n="browse">参照</button></div>
      </div>
      <div class="actions"><button id="cancel" class="cancel" data-i18n="cancel">キャンセル</button><button id="start" class="primary" data-i18n="start" disabled>▶ コピー開始</button></div>
    </div>

    <aside class="card side">
      <div class="side-title" data-i18n="summary">▣ 転送サマリー</div>
      <div class="metric"><span class="metric-label" data-i18n="filesFound">検出ファイル</span><span><b id="found" class="metric-value">0</b><span class="metric-unit" data-i18n="items">件</span></span></div>
      <div class="metric"><span class="metric-label" data-i18n="filesCopied">コピー済み</span><span><b id="copied" class="metric-value">0</b><span class="metric-unit" data-i18n="items">件</span></span></div>
      <div class="metric"><span class="metric-label" data-i18n="filesResumed">再開済み</span><span><b id="resumed" class="metric-value">0</b><span class="metric-unit" data-i18n="items">件</span></span></div>
      <div class="metric"><span class="metric-label" data-i18n="filesSkipped">スキップ</span><span><b id="skipped" class="metric-value">0</b><span class="metric-unit" data-i18n="items">件</span></span></div>
      <div class="metric"><span class="metric-label" data-i18n="errors">エラー</span><span><b id="errors" class="metric-value">0</b><span class="metric-unit" data-i18n="items">件</span></span></div>
    </aside>
  </section>

  <section class="card progress-card">
    <div class="progress-head"><div><div class="progress-title" data-i18n="copyProgress">↯ コピー進捗</div><div id="status" class="status">待機中</div></div><div id="percent" class="percent">容量 0.00%</div></div>
    <div class="track"><div id="fill" class="fill"></div></div>
    <div class="file-progress-head"><span data-i18n="fileProgress">ファイル進捗</span><span id="file-percent">0 / 0（0.0%）</span></div>
    <div class="track file-track"><div id="file-fill" class="fill file-fill"></div></div>
    <div class="progress-grid">
      <div class="stat"><b id="bytes">0 B</b><span data-i18n="bytesCopied">コピー済み</span></div>
      <div class="stat"><b id="total">0 B</b><span data-i18n="totalSize">合計サイズ</span></div>
      <div class="stat"><b id="speed">0.0 MiB/s</b><span data-i18n="averageSpeed">平均速度</span></div>
      <div class="stat"><b id="elapsed">0.0 秒</b><span data-i18n="elapsed">経過時間</span></div>
    </div>
    <div id="current" class="current">—</div>
    <div id="notice" class="notice"></div>
    <div id="error-list" class="error-list"></div>
  </section>
  <div class="foot">QuickFileCopy 0.1.0 · Native C++ / WebView2</div>
</main>
<script>
  'use strict';
  const $ = id => document.getElementById(id);
  const i18n={
    ja:{modeLabel:'モード',modeFast:'高速',modeVerify:'検証（SHA-256）',modeComplete:'完全保持（管理者）',modeCompleteVerify:'完全保持＋検証（管理者）',layoutLabel:'配置',layoutContents:'中身をコピー',layoutFolder:'フォルダごと',policyLabel:'競合',policySkip:'スキップ',policyOverwrite:'上書き',policyNewer:'新しい方',sourceTitle:'● コピー元',destinationTitle:'● コピー先',browse:'参照',cancel:'キャンセル',start:'▶ コピー開始',summary:'▣ 転送サマリー',filesFound:'検出ファイル',filesCopied:'コピー済み',filesResumed:'再開済み',filesSkipped:'スキップ',errors:'エラー',items:'件',copyProgress:'↯ コピー進捗',fileProgress:'ファイル進捗',bytesCopied:'コピー済み',totalSize:'合計サイズ',averageSpeed:'平均速度',elapsed:'経過時間',history:'履歴',selectSource:'コピー元を選択してください',selectDestination:'コピー先を選択してください',multipleSources:'{count}個のフォルダー：{paths}',idle:'待機中',capacity:'容量 {percent}%',measuringCapacity:'容量 計測中',measuring:'計測中',seconds:'{value} 秒',scanning:'スキャンしながらコピー中',scanStatus:'スキャンしながらコピー中（{found}件検出{workers}）',copyStatus:'コピー中（{workers}並列）',workerSuffix:'・{workers}並列',cancelling:'キャンセル中…',cancelled:'キャンセルしました',completedWithErrors:'エラーありで完了',copyComplete:'コピー完了',cancelNotice:'コピーをキャンセルしました。',errorNotice:'{count}件のエラーが発生しました。',successNotice:'コピーが正常に完了しました。',truncated:'（先頭100件のみ表示）',error_generic:'エラーが発生しました。',error_privilegedPipe:'特権ワーカー用パイプを作成できませんでした。',error_tooManySources:'選択したコピー元パスが多すぎます。',error_privilegedLaunch:'特権ワーカーを起動できませんでした',error_privilegedConnect:'特権ワーカーへ接続できませんでした。',error_privilegedNoResult:'特権ワーカーが結果を返さず終了しました。',error_missingSelection:'コピー元とコピー先を選択してください。',error_sourceHistoryMissing:'履歴のコピー元フォルダーが見つかりません。',error_destinationHistoryMissing:'履歴のコピー先フォルダーが見つかりません。'},
    en:{modeLabel:'Mode',modeFast:'Fast',modeVerify:'Verify (SHA-256)',modeComplete:'Preserve (Admin)',modeCompleteVerify:'Preserve + verify (Admin)',layoutLabel:'Layout',layoutContents:'Copy contents',layoutFolder:'Include folder',policyLabel:'Conflict',policySkip:'Skip',policyOverwrite:'Overwrite',policyNewer:'Newer only',sourceTitle:'● Sources',destinationTitle:'● Destination',browse:'Browse',cancel:'Cancel',start:'▶ Start copy',summary:'▣ Transfer summary',filesFound:'Files found',filesCopied:'Copied',filesResumed:'Resumed',filesSkipped:'Skipped',errors:'Errors',items:'files',copyProgress:'↯ Copy progress',fileProgress:'File progress',bytesCopied:'Copied',totalSize:'Total size',averageSpeed:'Average speed',elapsed:'Elapsed time',history:'History',selectSource:'Select one or more source folders',selectDestination:'Select a destination folder',multipleSources:'{count} folders: {paths}',idle:'Ready',capacity:'Bytes {percent}%',measuringCapacity:'Bytes measuring',measuring:'Measuring',seconds:'{value} sec',scanning:'Scanning and copying',scanStatus:'Scanning and copying ({found} files found{workers})',copyStatus:'Copying ({workers} workers)',workerSuffix:', {workers} workers',cancelling:'Cancelling…',cancelled:'Cancelled',completedWithErrors:'Completed with errors',copyComplete:'Copy complete',cancelNotice:'The copy was cancelled.',errorNotice:'{count} errors occurred.',successNotice:'The copy completed successfully.',truncated:'(showing the first 100 errors)',error_generic:'An error occurred.',error_privilegedPipe:'Could not create the privileged-worker pipe.',error_tooManySources:'Too many source paths were selected.',error_privilegedLaunch:'Could not start the privileged worker',error_privilegedConnect:'Could not connect to the privileged worker.',error_privilegedNoResult:'The privileged worker exited without returning a result.',error_missingSelection:'Select at least one source and a destination.',error_sourceHistoryMissing:'The source folder from history could not be found.',error_destinationHistoryMissing:'The destination folder from history could not be found.'}
  };
  const detectedLanguage=(navigator.language||'').toLowerCase().startsWith('ja')?'ja':'en';
  const state = { sources:[], destination:'', running:false, phase:'idle', lastPayload:{} };
  const defaults={mode:'fast',layout:'contents',policy:'skip',lang:detectedLanguage,sources:[],destinations:[]};
  function loadPrefs(){try{return {...defaults,...JSON.parse(localStorage.getItem('qfc.preferences')||'{}')}}catch{return {...defaults}}}
  const prefs=loadPrefs();
  if(!i18n[prefs.lang])prefs.lang=detectedLanguage;
  const t=(key,values={})=>{let text=(i18n[prefs.lang]&&i18n[prefs.lang][key])||i18n.en[key]||key; for(const [name,value] of Object.entries(values))text=text.replaceAll(`{${name}}`,value); return text};
  const locale=()=>prefs.lang==='ja'?'ja-JP':'en-US';
  const errorDetailsJa={
    'SACL preservation requires an elevated process with SeSecurityPrivilege.':'SACLの保持には、SeSecurityPrivilegeを持つ管理者プロセスが必要です。',
    'Existing destination directory could not be enabled for EFS encryption.':'既存のコピー先フォルダーでEFS暗号化を有効にできませんでした。',
    'EFS directory preservation failed':'EFSフォルダーの保持に失敗しました',
    'The destination resolves to the source itself or a directory inside it.':'コピー先がコピー元自身、またはコピー元配下のフォルダーになっています。',
    'Reparse-point preservation failed':'リパースポイントの保持に失敗しました',
    'Security descriptor preservation failed':'セキュリティ記述子の保持に失敗しました',
    'Extended-attribute preservation failed':'拡張属性の保持に失敗しました',
    'The reparse point could not replace the destination':'リパースポイントでコピー先を置換できませんでした',
    'EFS raw preservation failed':'EFS Rawデータの保持に失敗しました',
    'Privileged preallocated copy failed':'特権事前確保コピーに失敗しました',
    'Sparse-file layout preservation failed':'スパースファイル配置の保持に失敗しました',
    'NTFS compression preservation failed':'NTFS圧縮の保持に失敗しました',
    'SHA-256 verification failed':'SHA-256検証に失敗しました',
    'The completed temporary copy could not replace the destination':'完成した一時コピーでコピー先を置換できませんでした',
    'Hard-link preservation failed':'ハードリンクの保持に失敗しました',
    'Hard-link commit failed':'ハードリンクの確定に失敗しました',
    'Directory extended-attribute preservation failed':'フォルダー拡張属性の保持に失敗しました',
    'Directory timestamp/attribute preservation failed':'フォルダーの時刻・属性保持に失敗しました',
    'Directory security descriptor preservation failed':'フォルダーのセキュリティ記述子保持に失敗しました'
  };
  function localizeErrorDetail(message){if(prefs.lang!=='ja'||!message)return message; for(const [english,japanese] of Object.entries(errorDetailsJa)){if(message===english)return japanese;if(message.startsWith(`${english}:`))return japanese+message.slice(english.length)}return message}
  function savePrefs(){try{localStorage.setItem('qfc.preferences',JSON.stringify(prefs))}catch{}}
  function remember(key,path){if(!path)return; prefs[key]=[path,...(prefs[key]||[]).filter(item=>item!==path)].slice(0,10); savePrefs(); renderHistory(key)}
  function renderHistory(key){const id=key==='sources'?'source-history':'destination-history',select=$(id),current=select.value; select.replaceChildren(); const first=document.createElement('option'); first.value=''; first.textContent=t('history'); select.appendChild(first); for(const path of prefs[key]||[]){const option=document.createElement('option'); option.value=path; option.textContent=path; select.appendChild(option)} select.value=(prefs[key]||[]).includes(current)?current:''}
  function send(command, extra={}) {
    if (window.chrome && chrome.webview) chrome.webview.postMessage({version:1, command, ...extra});
  }
  function formatBytes(value) {
    const n = Number(value || 0), units=['B','KiB','MiB','GiB','TiB'];
    if (!n) return '0 B';
    const i=Math.min(units.length-1,Math.floor(Math.log(n)/Math.log(1024)));
    return `${(n/Math.pow(1024,i)).toFixed(i ? 1 : 0)} ${units[i]}`;
  }
  function setRunning(running) {
    state.running=running; $('start').disabled=running || !state.sources.length || !state.destination;
    $('cancel').style.display=running?'block':'none'; $('pick-source').disabled=running; $('pick-destination').disabled=running; $('policy').disabled=running; $('mode').disabled=running; $('layout').disabled=running;
  }
  function renderSelection(){const paths=state.sources.join(' / '),sourceText=state.sources.length>1?t('multipleSources',{count:state.sources.length.toLocaleString(locale()),paths}):(state.sources[0]||t('selectSource')); $('source-path').textContent=sourceText; $('source-path').title=state.sources.join('\n'); $('source-path').classList.toggle('selected',!!state.sources.length); $('destination-path').textContent=state.destination||t('selectDestination'); $('destination-path').classList.toggle('selected',!!state.destination); setRunning(state.running)}
  function renderStarted(){setRunning(true); $('cancel').disabled=false; $('status').textContent=t('scanning'); $('percent').textContent=t('measuringCapacity'); $('file-percent').textContent=t('measuring'); $('fill').style.width='0%'; $('file-fill').style.width='0%'; $('fill').parentElement.classList.add('indeterminate'); $('file-fill').parentElement.classList.add('indeterminate')}
  function renderProgress(payload){const pct=Number(payload.percent||0),scanning=!payload.scanComplete,found=Number(payload.filesFound||0),copied=Number(payload.filesCopied||0),skipped=Number(payload.filesSkipped||0),resumed=Number(payload.filesResumed||0),processed=Math.min(found,copied+skipped+resumed),filePct=found?processed*100/found:(payload.complete?100:0),number=value=>Number(value).toLocaleString(locale()); $('found').textContent=number(found); $('copied').textContent=number(copied); $('resumed').textContent=number(resumed); $('skipped').textContent=number(skipped); $('errors').textContent=number(payload.errors||0); $('fill').parentElement.classList.toggle('indeterminate',scanning); $('file-fill').parentElement.classList.toggle('indeterminate',scanning); $('percent').textContent=scanning?t('measuringCapacity'):t('capacity',{percent:pct.toFixed(2)}); $('file-percent').textContent=scanning?t('measuring'):`${number(processed)} / ${number(found)} (${filePct.toFixed(1)}%)`; if(!scanning){$('fill').style.width=`${pct}%`; $('file-fill').style.width=`${filePct}%`;} $('bytes').textContent=formatBytes(payload.bytesCopied); $('total').textContent=formatBytes(payload.totalBytes); $('speed').textContent=`${Number(payload.speedMiB||0).toFixed(1)} MiB/s`; $('elapsed').textContent=t('seconds',{value:Number(payload.elapsed||0).toFixed(1)}); $('current').textContent=payload.currentPath||'—'; const workers=Number(payload.workers||0),workerSuffix=workers?t('workerSuffix',{workers}):''; $('status').textContent=scanning?t('scanStatus',{found:number(found),workers:workerSuffix}):t('copyStatus',{workers})}
  function renderCompleted(payload){setRunning(false); $('cancel').disabled=false; $('fill').parentElement.classList.remove('indeterminate'); $('file-fill').parentElement.classList.remove('indeterminate'); const errors=Number(payload.errors||0); $('status').textContent=payload.cancelled?t('cancelled'):errors?t('completedWithErrors'):t('copyComplete'); $('notice').className=`notice ${errors?'error':'done'}`; $('notice').textContent=payload.cancelled?t('cancelNotice'):errors?t('errorNotice',{count:errors.toLocaleString(locale())}):t('successNotice'); const details=Array.isArray(payload.errorDetails)?payload.errorDetails:[]; if(details.length){$('error-list').textContent=details.map(e=>`[${e.code}] ${e.path}\n${localizeErrorDetail(e.message)}`).join('\n\n')+(payload.errorsTruncated?`\n\n${t('truncated')}`:''); $('error-list').className='error-list visible'}else{$('error-list').className='error-list';$('error-list').textContent=''}}
  function renderError(payload){const base=payload.messageKey?t(`error_${payload.messageKey}`):(payload.message||t('error_generic')); $('notice').className='notice error'; $('notice').textContent=payload.detail?`${base}: ${payload.detail}`:base; setRunning(false)}
  function renderPhase(){if(state.phase==='idle'){$('status').textContent=t('idle');$('percent').textContent=t('capacity',{percent:'0.00'});$('file-percent').textContent='0 / 0 (0.0%)';$('elapsed').textContent=t('seconds',{value:'0.0'})}else if(state.phase==='started')renderStarted();else if(state.phase==='progress')renderProgress(state.lastPayload);else if(state.phase==='completed')renderCompleted(state.lastPayload);else if(state.phase==='error')renderError(state.lastPayload)}
  function applyLanguage(){document.documentElement.lang=prefs.lang; document.querySelectorAll('[data-i18n]').forEach(element=>{element.textContent=t(element.dataset.i18n)}); $('lang-text').textContent=prefs.lang==='ja'?'🌐 English':'🌐 日本語'; $('btn-lang').title='Toggle Language / 言語切替'; renderHistory('sources'); renderHistory('destinations'); renderSelection(); renderPhase()}
  $('pick-source').onclick=()=>send('pickSource');
  $('pick-destination').onclick=()=>send('pickDestination');
  $('btn-lang').onclick=()=>{prefs.lang=prefs.lang==='ja'?'en':'ja';savePrefs();applyLanguage()};
  $('source-history').onchange=()=>{if($('source-history').value)send('setSource',{path:$('source-history').value})};
  $('destination-history').onchange=()=>{if($('destination-history').value)send('setDestination',{path:$('destination-history').value})};
  for(const id of ['mode','layout','policy']){$(id).value=prefs[id]||defaults[id]; $(id).onchange=()=>{prefs[id]=$(id).value;savePrefs()}}
  applyLanguage();
  $('start').onclick=()=>{ $('notice').className='notice'; $('notice').textContent=''; $('error-list').className='error-list'; $('error-list').textContent=''; send('startCopy',{policy:$('policy').value,mode:$('mode').value,layout:$('layout').value}); };
  $('cancel').onclick=()=>{ $('status').textContent=t('cancelling'); $('cancel').disabled=true; send('cancel'); };
  if (window.chrome && chrome.webview) chrome.webview.addEventListener('message', event => {
    const data=event.data || {}, payload=data.payload || {};
    if (data.event==='selection') {
      state.sources=Array.isArray(payload.sources)?payload.sources:[]; state.destination=payload.destination||'';
      for(const source of state.sources)remember('sources',source); remember('destinations',state.destination);
      renderSelection();
    } else if (data.event==='started') {
      state.phase='started';state.lastPayload=payload;renderStarted();
    } else if (data.event==='progress') {
      state.phase='progress';state.lastPayload=payload;renderProgress(payload);
    } else if (data.event==='completed') {
      state.phase='completed';state.lastPayload=payload;renderCompleted(payload);
    } else if (data.event==='error') {
      state.phase='error';state.lastPayload=payload;renderError(payload);
    }
  });
  send('getState');
</script>
</body>
